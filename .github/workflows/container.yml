name: Build Chunker Web Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - web_converter.py
      - .github/workflows/container.yml
  schedule:
    # Check daily for new upstream Chunker releases.
    - cron: "23 10 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover latest Chunker release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Get latest upstream Chunker release
        id: latest
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://api.github.com/repos/HiveGamesOSS/Chunker/releases/latest | jq -r '.tag_name')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not determine latest Chunker version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest Chunker release: $version"

      - name: Compute image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: $image"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether latest Chunker image tag already exists
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.image.outputs.image }}:chunker-${{ steps.latest.outputs.version }}"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing image found: $tag"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "No image found for: $tag"
          fi

      - name: Decide whether to build
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.check.outputs.tag_exists }}" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled check found no new Chunker version; skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building image."
          fi

  build:
    name: Build and publish image
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CHUNKER_VERSION=${{ needs.discover.outputs.version }}
          tags: |
            ${{ needs.discover.outputs.image }}:latest
            ${{ needs.discover.outputs.image }}:chunker-${{ needs.discover.outputs.version }}
            ${{ needs.discover.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Chunker Web Converter
            org.opencontainers.image.description=Browser UI for converting zipped Minecraft Java worlds to Bedrock .mcworld files using Chunker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=chunker-${{ needs.discover.outputs.version }}
